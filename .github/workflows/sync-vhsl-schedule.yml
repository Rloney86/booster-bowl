name: Sync VHSL football schedule

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and validate only; do not write to Supabase"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/sync_vhsl_schedule.py"
      - ".github/workflows/sync-vhsl-schedule.yml"
  pull_request:
    paths:
      - "scripts/sync_vhsl_schedule.py"
      - ".github/workflows/sync-vhsl-schedule.yml"
  schedule:
    - cron: "15 10 * 8-11 1,4"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Parse and validate VHSL schedule
        env:
          DRY_RUN: "1"
        run: python scripts/sync_vhsl_schedule.py

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Sync remaining VHSL Class 2-6 games to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python scripts/sync_vhsl_schedule.py
